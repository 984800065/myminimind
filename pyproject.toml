[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "myminimind"
version = "0.1.0"
description = "MyMinimind: MiniMind 模型与训练"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "datasets>=2.14.4",
    "datasketch>=1.9.0",
    "deepspeed>=0.18.8",
    "einops>=0.8.2",
    "flask>=3.1.3",
    "flask-cors>=6.0.2",
    "httpx[socks]>=0.28.1",
    "jieba>=0.42.1",
    "jinja2>=3.1.6",
    "jsonlines>=4.0.0",
    "lm-eval[hf]>=0.4.11",
    "loguru>=0.7.3",
    "marshmallow>=4.2.2",
    "matplotlib>=3.10.8",
    "ngrok>=1.4.0",
    "nltk>=3.9.4",
    "numpy>=1.26.4",
    "openai>=2.29.0",
    "peft>=0.18.1",
    "psutil>=7.2.2",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "rich>=13.9.4",
    "ruff>=0.15.7",
    "scikit-learn>=1.7.2",
    "sentence-transformers>=5.3.0",
    "simhash>=2.1.2",
    "streamlit>=1.55.0",
    "swanlab>=0.7.13",
    "tiktoken>=0.12.0",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "transformers>=4.57.6",
    "trl>=0.11.4",
    "ujson>=5.12.0",
    "wandb>=0.25.1",
]
# 依赖统一用 requirements.txt 管理（便于 torch 等走指定源），此处不声明

[tool.setuptools.packages.find]
where = ["."]
include = ["myminimind*"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[tool.ruff]
line-length = 320
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportArgumentType = "none"
